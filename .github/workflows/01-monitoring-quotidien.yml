name: Surveillance technique quotidienne

# Vérifie le site EN LIGNE (virginiedeconinck.com). Lecture seule.
# Ne modifie JAMAIS le contenu, ne fusionne rien, ne publie rien.
# En cas de problème : ouvre / met à jour une Issue d'alerte.
# Aucune clé API Anthropic, aucun jeton Netlify : uniquement GITHUB_TOKEN.

on:
  schedule:
    - cron: '0 6 * * 1'   # hebdomadaire, lundi ~08:00 Europe/Luxembourg (06:00 UTC)
  workflow_dispatch: {}    # lançable manuellement depuis l'onglet Actions

permissions:
  contents: write   # nécessaire au "battement de coeur" ci-dessous (étape 6)
  issues: write

env:
  SITE: https://virginiedeconinck.com

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (configs lychee/lighthouse)
        uses: actions/checkout@v4

      # 1) Disponibilité + codes HTTP des pages du sitemap (échec si 4xx/5xx)
      - name: Disponibilite & 404 (depuis sitemap.xml)
        id: http
        run: |
          set -e
          echo "Récupération du sitemap…"
          curl -fsS "$SITE/sitemap.xml" -o sitemap.xml
          URLS=$(grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed 's/<\/\?loc>//g')
          echo "$(echo "$URLS" | wc -l) URLs à tester"
          FAIL=0
          for u in $URLS; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$u")
            if [ "$code" != "200" ]; then echo "::error::$u -> HTTP $code"; FAIL=1; else echo "ok  $u -> $code"; fi
          done
          # robots.txt + sitemap eux-mêmes
          for f in robots.txt sitemap.xml llms.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/$f")
            if [ "$code" != "200" ]; then echo "::error::/$f -> HTTP $code"; FAIL=1; else echo "ok  /$f -> $code"; fi
          done
          # une URL qui doit renvoyer 404 (sanity du 404 handler)
          nf=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/page-inexistante-test-404")
          echo "page inexistante -> $nf (404 attendu)"
          exit $FAIL

      # 2) Balises canoniques présentes sur un échantillon
      - name: Canoniques presentes
        if: always()
        run: |
          set -e
          FAIL=0
          for p in "" "perimenopause" "resistance-insuline" "blog/glycemie-nocturne-peau"; do
            if curl -fsS "$SITE/$p" | grep -q 'rel="canonical"'; then echo "ok canonical /$p"; else echo "::error::canonical manquant /$p"; FAIL=1; fi
          done
          exit $FAIL

      # 3) Liens cassés (interne + sortants) sur les pages publiées
      # On pointe lychee sur de VRAIES pages HTML (pas le sitemap.xml, qu'il ne sait pas lire :
      # il renvoyait "No links were found" -> erreur de config -> faux echec du run).
      - name: Verification liens (lychee)
        if: always()
        continue-on-error: true   # purement informatif : ne fait jamais echouer la surveillance
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --accept 200,206,429 "${{ env.SITE }}/" "${{ env.SITE }}/blog"
          fail: false   # un lien externe capricieux ne declenche aucune alerte

      # 4) Lighthouse (SEO, perf, accessibilité, mobile) — informatif
      - name: Lighthouse (mobile)
        if: always()
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://virginiedeconinck.com/
            https://virginiedeconinck.com/perimenopause
            https://virginiedeconinck.com/blog
          configPath: ./automation/lighthouserc.json
          uploadArtifacts: true

      # 5) Etat du dernier déploiement Netlify (sans jeton) via en-tête public
      - name: Etat deploiement (en-tete public)
        if: always()
        run: |
          curl -sI "$SITE/" | grep -iE 'x-nf-request-id|server|age' || true
          echo "Le détail des déploiements reste consultable sur app.netlify.com/projects/virginiedck."

      # 6) Battement de coeur hebdomadaire (ajouté le 20/07/2026).
      # GitHub DESACTIVE tout seul un workflow planifié après 60 jours SANS COMMIT sur le
      # dépôt (pas sans exécution : ce monitoring peut tourner chaque semaine pendant des mois,
      # s'il ne pousse rien la surveillance s'éteint quand même). Sans ce commit, le dernier
      # push datait du 06/07/2026 -> extinction estimée le 04/09/2026, en plein pendant les
      # vacances de Virginie (depart 07/08). Ce commit hebdomadaire reinitialise le compteur
      # en permanence. [skip netlify] : n'importe où dans le message evite de gaspiller un
      # build/deploiement Netlify pour un simple horodatage qui ne change rien au site
      # (verifie dans la doc Netlify le 20/07/2026 : marche aussi sur un push direct, pas
      # seulement un titre de PR).
      - name: Battement de coeur (empeche l'auto-desactivation GitHub a 60j d'inactivite)
        if: always()
        run: |
          mkdir -p automation
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') surveillance passee (run ${{ github.run_id }})" > automation/heartbeat.txt
          git config user.name "vdck-bot"
          git config user.email "bot@users.noreply.github.com"
          git add automation/heartbeat.txt
          if git diff --cached --quiet; then
            echo "aucun changement (deja passe cette semaine)"
          else
            git commit -m "chore(surveillance): battement de coeur hebdomadaire $(date -u +'%Y-%m-%d') [skip netlify]"
            n=0
            until git push origin HEAD:main; do
              n=$((n+1))
              if [ "$n" -ge 5 ]; then echo "::error::push impossible apres 5 tentatives"; exit 1; fi
              git pull --rebase origin main
              sleep $((RANDOM % 5 + 2))
            done
          fi

  alerte:
    needs: checks
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ouvrir / mettre a jour l'Issue d'alerte
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const titre = "⚠️ Surveillance technique : anomalie détectée";
            const corps = `La surveillance quotidienne a détecté un problème.\n\nVoir le détail du run : ${run}\n\n_(Cette issue est ouverte automatiquement. Elle ne modifie ni ne publie aucun contenu.)_`;
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "surveillance" });
            if (existing.data.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body: corps });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: titre, body: corps, labels: ["surveillance"] });
            }
