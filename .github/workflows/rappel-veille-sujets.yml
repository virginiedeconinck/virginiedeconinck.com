# RAPPEL DE LA VEILLE, envoye depuis les serveurs de GitHub (donc meme si le Mac est eteint).
#
# Pourquoi (demande de Virginie, 20/10/2026) : les sujets d'articles lui sont proposes
# le 24 (article du 1er) et le 8 (article du 15) par la tache planifiee
# `choix-sujet-article-mensuel`, qui tourne sur son Mac. Si le Mac est eteint, rien ne
# part. Ses mots : « la meilleure facon, c'est de m'envoyer des emails [...] j'ai
# toujours mon telephone avec moi ». Ce rappel part la veille, le 23 et le 7.
#
# GitHub ne tient pas l'heure des crons sur un depot gratuit (retard mesure de 30 min a
# 2h30, voir surveillance-site-public.yml) : 14h UTC vise la fin d'apres-midi.
name: Rappel veille sujets d'articles

on:
  schedule:
    - cron: '0 14 7,23 * *'
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un essai (objet marque [TEST])"
        type: boolean

jobs:
  rappel:
    runs-on: ubuntu-latest
    steps:
      - name: Email de rappel (Brevo)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EST_TEST: ${{ inputs.test == true }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, datetime
          cle = os.environ.get('BREVO_API_KEY', '').strip()
          if not cle:
              raise SystemExit("::error::Secret BREVO_API_KEY absent : le rappel n'est PAS parti.")
          demain = datetime.date.today() + datetime.timedelta(days=1)
          parution = "1er" if demain.day >= 16 else "15"
          j = demain.strftime('%d/%m')
          test = os.environ.get('EST_TEST') == 'true'
          sujet = ("[TEST] " if test else "") + f"Demain, tes sujets d'articles"
          tete = ("<p><strong>Ceci est un essai : le vrai rappel partira la veille du 24 et du 8.</strong></p>"
                  if test else "")
          html = (
              "<div style=\"font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;"
              "font-size:17px;line-height:1.6;color:#1a1a2e\">" + tete +
              f"<p>Virginie,</p><p>Demain matin ({j}), je t'envoie 3 sujets d'articles pour "
              f"l'article du {parution}, avec les photos proposees.</p>"
              "<p><strong>Laisse ton Mac allume ce soir</strong>, application Claude ouverte "
              "et ecran non rabattu. Sinon, rien ne part.</p>"
              "<p style=\"color:#666;font-size:14px\">Rappel automatique envoye depuis GitHub.</p></div>")
          req = urllib.request.Request('https://api.brevo.com/v3/smtp/email',
              data=json.dumps({
                  "sender": {"name": "Site virginiedeconinck.com", "email": "alertes@virginiedeconinck.com"},
                  "to": [{"email": "virginiedeconinck@gmail.com", "name": "Virginie"}],
                  "subject": sujet, "htmlContent": html}).encode(),
              headers={'api-key': cle, 'content-type': 'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as r:
              print("Rappel accepte par Brevo, code", r.status, r.read().decode()[:200])
          PY
